name: Expiry Alerts

on:
  schedule:
    - cron: '0 7 * * *'  # Every day at 7:00 UTC (10:00 Israel)
  workflow_dispatch:       # Allow manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check expiring services and send email alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          node --input-type=module <<'SCRIPT'

          const { SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY } = process.env;

          if (!SUPABASE_URL || !SUPABASE_SERVICE_ROLE_KEY) {
            console.log('Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY');
            process.exit(0);
          }
          if (!RESEND_API_KEY) {
            console.log('Missing RESEND_API_KEY — skipping email');
          }

          const headers = {
            'apikey': SUPABASE_SERVICE_ROLE_KEY,
            'Authorization': `Bearer ${SUPABASE_SERVICE_ROLE_KEY}`,
            'Content-Type': 'application/json',
          };

          // 1. Get all user notification preferences
          const settingsRes = await fetch(`${SUPABASE_URL}/rest/v1/user_settings?select=*`, { headers });
          const settings = await settingsRes.json();
          console.log(`Found ${settings.length} user settings`);

          // Build map of user notification prefs
          const notifPrefs = {};
          for (const s of settings) {
            if (s.notif_enabled && s.notif_email) {
              notifPrefs[s.user_id] = {
                email: s.notif_email,
                daysBefore: s.notif_days_before || 30,
              };
            }
          }

          const userIds = Object.keys(notifPrefs);
          if (userIds.length === 0) {
            console.log('No users with notifications enabled');
            process.exit(0);
          }

          console.log(`${userIds.length} user(s) with notifications enabled`);

          // 2. Get services for those users that have expiry dates
          const servicesRes = await fetch(
            `${SUPABASE_URL}/rest/v1/services?select=id,nickname,provider,category,contract_end_date,benefit_end_date,reminder_frequency,last_reminder_sent,user_id&or=(contract_end_date.neq.,benefit_end_date.neq.,reminder_frequency.in.(WEEKLY,MONTHLY,QUARTERLY))`,
            { headers }
          );
          const services = await servicesRes.json();
          console.log(`Found ${services.length} services with dates or reminders`);

          // 3. Check each service against user prefs
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          const todayStr = today.toISOString().slice(0, 10);

          function daysUntil(dateStr) {
            if (!dateStr) return null;
            const d = new Date(dateStr);
            return Math.ceil((d.getTime() - today.getTime()) / 86400000);
          }

          function daysSinceLast(lastSent) {
            if (!lastSent) return 999;
            const d = new Date(lastSent);
            return Math.ceil((today.getTime() - d.getTime()) / 86400000);
          }

          const FREQ_DAYS = { WEEKLY: 7, MONTHLY: 30, QUARTERLY: 90 };

          // Group alerts by user
          const userAlerts = {};

          for (const svc of services) {
            const prefs = notifPrefs[svc.user_id];
            if (!prefs) continue;

            const freq = svc.reminder_frequency || 'BEFORE_EXPIRY';
            const sinceLast = daysSinceLast(svc.last_reminder_sent);

            // Recurring reminders
            if (freq in FREQ_DAYS) {
              if (sinceLast >= FREQ_DAYS[freq]) {
                if (!userAlerts[svc.user_id]) userAlerts[svc.user_id] = [];
                userAlerts[svc.user_id].push({
                  id: svc.id,
                  name: svc.nickname,
                  provider: svc.provider || '',
                  type: `${freq.toLowerCase()} reminder`,
                  date: null,
                  days: null,
                });
              }
              continue;
            }

            // Before-expiry alerts
            if (freq === 'NONE') continue;

            const threshold = prefs.daysBefore;

            if (svc.contract_end_date) {
              const d = daysUntil(svc.contract_end_date);
              if (d !== null && d >= 0 && d <= threshold && sinceLast >= 7) {
                if (!userAlerts[svc.user_id]) userAlerts[svc.user_id] = [];
                userAlerts[svc.user_id].push({
                  id: svc.id,
                  name: svc.nickname,
                  provider: svc.provider || '',
                  type: 'contract',
                  date: svc.contract_end_date,
                  days: d,
                });
              }
            }
            if (svc.benefit_end_date) {
              const d = daysUntil(svc.benefit_end_date);
              if (d !== null && d >= 0 && d <= threshold && sinceLast >= 7) {
                if (!userAlerts[svc.user_id]) userAlerts[svc.user_id] = [];
                userAlerts[svc.user_id].push({
                  id: svc.id,
                  name: svc.nickname,
                  provider: svc.provider || '',
                  type: 'benefit',
                  date: svc.benefit_end_date,
                  days: d,
                });
              }
            }
          }

          // 4. Send emails
          const userCount = Object.keys(userAlerts).length;
          if (userCount === 0) {
            console.log('No alerts to send today');
            process.exit(0);
          }

          for (const [userId, alerts] of Object.entries(userAlerts)) {
            const email = notifPrefs[userId].email;
            console.log(`Sending ${alerts.length} alert(s) to ${email}`);

            // Build email body
            let html = `<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto;">`;
            html += `<h2 style="color: #6d28d9;">🏠 Household — Service Alerts</h2>`;
            html += `<p>You have <strong>${alerts.length}</strong> service alert(s) that need your attention:</p>`;
            html += `<table style="width: 100%; border-collapse: collapse; margin: 16px 0;">`;
            html += `<tr style="background: #f3f4f6; text-align: left;"><th style="padding: 10px 12px;">Service</th><th style="padding: 10px 12px;">Type</th><th style="padding: 10px 12px;">Date</th><th style="padding: 10px 12px;">Days Left</th></tr>`;

            for (const alert of alerts) {
              const urgentColor = alert.days !== null && alert.days <= 7 ? '#ef4444' : alert.days !== null && alert.days <= 30 ? '#f59e0b' : '#6b7280';
              html += `<tr style="border-bottom: 1px solid #e5e7eb;">`;
              html += `<td style="padding: 10px 12px;"><strong>${alert.name}</strong>${alert.provider ? ` <span style="color: #9ca3af;">${alert.provider}</span>` : ''}</td>`;
              html += `<td style="padding: 10px 12px; text-transform: capitalize;">${alert.type}</td>`;
              html += `<td style="padding: 10px 12px;">${alert.date || '—'}</td>`;
              html += `<td style="padding: 10px 12px; color: ${urgentColor}; font-weight: 600;">${alert.days !== null ? `${alert.days} days` : alert.type}</td>`;
              html += `</tr>`;
            }

            html += `</table>`;
            html += `<p style="color: #6b7280; font-size: 14px;">Review your services at <a href="https://household-l68y.vercel.app" style="color: #6d28d9;">household-l68y.vercel.app</a></p>`;
            html += `</div>`;

            // Send via Resend
            if (RESEND_API_KEY) {
              try {
                const res = await fetch('https://api.resend.com/emails', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${RESEND_API_KEY}`,
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({
                    from: 'Household Alerts <onboarding@resend.dev>',
                    to: [email],
                    subject: `🔔 ${alerts.length} service alert${alerts.length > 1 ? 's' : ''} — Household`,
                    html,
                  }),
                });

                if (res.ok) {
                  console.log(`  ✓ Email sent to ${email}`);
                } else {
                  const err = await res.text();
                  console.log(`  ✗ Failed: ${res.status} ${err}`);
                }
              } catch (e) {
                console.log(`  ✗ Error: ${e.message}`);
              }
            }

            // 5. Update last_reminder_sent on services
            const serviceIds = alerts.map(a => a.id);
            for (const sid of serviceIds) {
              await fetch(`${SUPABASE_URL}/rest/v1/services?id=eq.${sid}`, {
                method: 'PATCH',
                headers,
                body: JSON.stringify({ last_reminder_sent: todayStr }),
              });
            }
          }

          console.log('Done!');
          SCRIPT
